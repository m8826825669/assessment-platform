name: Foundation gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    name: PostgreSQL 17 / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: assessment_ci
          POSTGRES_PASSWORD: assessment_ci_disposable_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assessment_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ASSESSMENT_TEST_ADMIN_URL: postgresql+psycopg://assessment_ci:assessment_ci_disposable_only@127.0.0.1:5432/postgres
      ASSESSMENT_ALLOW_TEST_DATABASE_CREATION: '1'
      ASSESSMENT_ALLOW_TEST_MEDIA_CREATION: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned environment
        run: python scripts/setup_dev.py
      - name: Start isolated object storage and scanner
        run: |
          docker compose -f infrastructure/compose.media.yaml up -d --build media_test_store clamav
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:19010/minio/health/live >/dev/null && docker compose -f infrastructure/compose.media.yaml exec -T clamav clamdscan --ping=1; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Full gate (no skipped tests)
        run: backend/.venv/bin/python scripts/verify.py
      - name: Gate summary
        if: always()
        run: |
          if [ -f artifacts/verification.json ]; then
            cat artifacts/verification.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stop disposable media services
        if: always()
        run: docker compose -f infrastructure/compose.media.yaml down -v
  windows:
    name: Windows / Python 3.12 (partial)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned environment
        run: python scripts/setup_dev.py
      - name: Portable checks (PostgreSQL covered by Linux jobs)
        run: backend/.venv/Scripts/python.exe scripts/verify.py --unit-only
